name: Android APK

# Builds a debug APK for side loading and republishes it as a pre-release tagged
# with the build stamp. Older pre-releases are deleted, so exactly one download
# stays available while each build keeps its own version-named tag.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      head_sha: ${{ steps.version.outputs.head_sha }}
      file_name: ${{ steps.version.outputs.file_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version stamp counts commits, so a shallow clone stamps a wrong env.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # v3 still defaults to installing "tools platform-tools", and the obsolete
      # `tools` package was removed from the SDK repository, so the default aborts
      # the whole run. Pin the packages we actually need instead.
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          # Space separated, not a yaml list: the action forwards this straight to
          # sdkmanager as one argument and does not split on newlines.
          packages: 'platform-tools platforms;android-37.0'

      # A runner has no signing key of its own, and generates a new one on first use.
      # Two builds signed with different keys cannot install over one another, which
      # makes every published build uninstallable on any phone that already has the
      # app, so the key is restored from the secrets before anything is assembled.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.QQFM_SIGNING_KEYSTORE_B64 }}
          STORE_FILE: ${{ secrets.QQFM_SIGNING_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.QQFM_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.QQFM_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QQFM_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE}" ]; then
            echo "No signing key in secrets: this build will be signed with the"
            echo "runner's throwaway debug key and cannot replace an installed app."
            exit 0
          fi
          mkdir -p "$(dirname "$STORE_FILE")"
          printf '%s' "$KEYSTORE" | base64 -d > "$STORE_FILE"
          chmod 600 "$STORE_FILE"
          echo "Restored signing key for alias $KEY_ALIAS"

      - name: Assemble debug APK
        env:
          QQFM_SIGNING_STORE_FILE: ${{ secrets.QQFM_SIGNING_STORE_FILE }}
          QQFM_SIGNING_STORE_PASSWORD: ${{ secrets.QQFM_SIGNING_STORE_PASSWORD }}
          QQFM_SIGNING_KEY_PASSWORD: ${{ secrets.QQFM_SIGNING_KEY_PASSWORD }}
          QQFM_SIGNING_KEY_ALIAS: ${{ secrets.QQFM_SIGNING_KEY_ALIAS }}
        run: ./gradlew :app:assembleDebug

      # A build that quietly fell back to the runner's own key is the exact failure
      # this workflow exists to prevent, and it would look like a green run.
      - name: Check what actually signed the APK
        run: |
          set -euo pipefail
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$aapt2" dump badging "$apk" > /dev/null
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          digest="$("$signer" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "Signed with: $digest"
          expected="${{ secrets.QQFM_SIGNING_EXPECTED_DIGEST }}"
          if [ -n "$expected" ] && [ "${digest,,}" != "${expected,,}" ]; then
            echo "::error::built APK is signed with $digest but the shared key is $expected"
            exit 1
          fi

      # The APK is the point of this workflow, so read the stamp out of the built
      # manifest rather than re-deriving it: assembling already bumped the pack
      # counter, so a separately computed version would disagree with what shipped.
      - name: Stamp the artifact
        id: version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"

          badging="$("$aapt2" dump badging "$apk")"
          version_name="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          short_sha="$(git rev-parse --short=8 HEAD)"
          # Full sha separately: actions/checkout only treats a ref as a commit when
          # it is all 40 hex characters, and would read a short one as a branch name.
          head_sha="$(git rev-parse HEAD)"

          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "could not read a version out of the built APK" >&2
            exit 1
          fi

          # One tag cannot hold two releases, and repeats of the same commit share a
          # version stamp, so the run number keeps downloads distinguishable on disk.
          file_name="qqfm-${version_name}-build${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          mkdir -p dist
          cp "$apk" "dist/$file_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "short_sha=$short_sha"
            echo "head_sha=$head_sha"
            echo "file_name=$file_name"
          } >> "$GITHUB_OUTPUT"

          echo "Built $file_name (versionCode $version_code)"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
      FILE_NAME: ${{ needs.build.outputs.file_name }}
    steps:
      # gh release create needs a work tree to build the tag from, and pinning the
      # ref keeps the release attached to the exact commit that produced the APK.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.head_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The build stamp is the tag: it orders the releases and keeps each build
          # addressable, while the version is what the in-app updater reads.
          TAG="$VERSION_NAME"

          notes="$(cat <<EOF
          Pre-release built from master.

          - version \`$VERSION_NAME\` (versionCode \`$VERSION_CODE\`)
          - commit \`$SHORT_SHA\`
          - run $GITHUB_RUN_NUMBER, branch \`${GITHUB_REF_NAME}\`

          Each build is signed with one long-lived key, so \`adb install -r\`
          replaces an installed copy in place, and the in-app updater can install
          this build over the one already on the device.
          EOF
          )"

          mapfile -t built < <(find dist -maxdepth 1 -name '*.apk')
          if [ "${#built[@]}" -ne 1 ]; then
            echo "expected exactly one APK under dist, found ${#built[@]}" >&2
            printf '  %s\n' "${built[@]:-none}" >&2
            exit 1
          fi
          file_name="${built[0]#dist/}"
          echo "Publishing $file_name as $TAG"

          # Only the newest pre-release is kept, so a repeat of the same commit can
          # replace its own tag and every older one is removed with its tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true) | .tagName' \
            | while IFS= read -r old_tag; do
                if [ -n "$old_tag" ] && [ "$old_tag" != "$TAG" ]; then
                  gh release delete "$old_tag" --yes --cleanup-tag
                fi
              done

          gh release create "$TAG" "${built[0]}" \
            --title "QQFM $VERSION_NAME" \
            --notes "$notes" \
            --prerelease

          echo "Published $file_name to the $TAG pre-release"
